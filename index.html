<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Melengym">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon.png">
<title>Melengym</title>
<style>
:root{
  --bg:#000000; --surface:#121315; --surface2:#1c1e21; --line:#2c2f34;
  --text:#ffffff; --muted:#9aa0a8; --faint:#6b7179;
  --accent:#ffffff; --accent-ink:#000000; --accent-dim:#9aa0a8;
  --danger:#ff5f5f; --ok:#ffffff; --blue:#ffffff;
  --r:16px; --r-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.45;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;border:none;background:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
header.top{
  position:sticky;top:0;z-index:30;background:rgba(0,0,0,.82);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid var(--line);
}
.top-row{display:flex;align-items:center;gap:10px;min-height:34px}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
main{flex:1;padding:14px 16px calc(96px + var(--safe-b))}
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(0,0,0,.9);backdrop-filter:saturate(160%) blur(18px);
  -webkit-backdrop-filter:saturate(160%) blur(18px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));
}
nav.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.01em;
  border-radius:12px;
}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

/* ---------- blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.b{font-weight:650}
.center{text-align:center}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:20px 2px 9px}
.sec-title:first-child{margin-top:4px}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px -14px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  padding:12px 16px;border-radius:var(--r-sm);font-weight:600;font-size:15px;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.full{display:flex;width:100%}
.btn.big{padding:16px;font-size:16.5px;border-radius:14px}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:9px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.45}
.iconbtn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--line)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-block;background:var(--surface2);border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:650;color:var(--muted)}
.pill.pr{background:#ffffff;color:#000000}

label.fld{display:block;margin-bottom:12px}
label.fld > span{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px;outline:none;appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent-dim)}
textarea{min-height:76px;resize:vertical}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238d94a3' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}

.empty{text-align:center;padding:42px 18px;color:var(--faint)}
.empty svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.6;margin-bottom:10px}
.empty p{margin:0 0 4px;font-size:14.5px}

/* list items */
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;text-align:left;width:100%}
.item:active{background:var(--surface2)}
.item .av{width:40px;height:40px;border-radius:11px;background:var(--surface2);display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--accent);flex:none}
.item .cv{width:9px;height:9px}
.item > svg{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.item .av svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ex-head > svg{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.sec-title + .item{margin-top:0}

/* set rows */
.ex-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ex-head .nm{font-weight:650;font-size:15.5px}
.setgrid{display:grid;grid-template-columns:26px 62px 1fr 1fr 44px;gap:7px;align-items:center;padding:7px 10px}
.setgrid.head{color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-bottom:2px;padding-top:9px}
.setgrid input{padding:11px 6px;text-align:center;font-weight:650;font-size:16px}
.setgrid .idx{text-align:center;color:var(--faint);font-weight:700;font-size:13px}
.setgrid .prev{text-align:center;font-size:12.5px;color:var(--muted);line-height:1.15;font-weight:650;
  padding:6px 2px;border-radius:8px;white-space:nowrap}
.setgrid button.prev:active{background:var(--surface2)}
.setgrid .prev.nada{color:var(--faint);font-weight:500}
.setgrid.cardio{grid-template-columns:26px 1fr 1fr 56px 44px}
.setgrid input::placeholder{color:#5c636d;font-weight:650;opacity:1}
.setgrid input::-webkit-input-placeholder{color:#5c636d;font-weight:650}
.ck{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);
  display:flex;align-items:center;justify-content:center}
.ck svg{width:19px;height:19px;stroke:var(--faint);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ck.on{background:var(--accent);border-color:transparent}
.ck.on svg{stroke:var(--accent-ink)}
.row-done input{opacity:.62}
.ex-foot{display:flex;gap:8px;padding:8px 10px 11px}

/* sticky action bar */
.actionbar{position:fixed;left:0;right:0;bottom:calc(60px + var(--safe-b));z-index:35;padding:0 12px 10px;
  pointer-events:none}
.actionbar .inner{pointer-events:auto;background:rgba(21,23,28,.96);border:1px solid var(--line);
  border-radius:15px;padding:9px 10px 9px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(14px)}
.timer-num{font-size:23px;font-weight:700;letter-spacing:-.02em}

/* modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .24s cubic-bezier(.3,.9,.3,1)}
.sheet.on{transform:translateY(0)}
.sheet-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-head h2{margin:0;font-size:17.5px;font-weight:700;flex:1}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(18px + var(--safe-b))}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid .ph{position:relative;aspect-ratio:3/4;border-radius:11px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.pgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .ph .dt{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:10.5px;font-weight:650;
  background:linear-gradient(transparent,rgba(0,0,0,.78));text-align:center}
.pgrid .ph.sel{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.pgrid .ph .selbadge{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp figure{margin:0}
.cmp img{width:100%;border-radius:11px;display:block;background:var(--surface2)}
.cmp figcaption{font-size:11.5px;color:var(--muted);text-align:center;padding-top:5px;font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 10px}
.stat .v{font-size:19px;font-weight:700;letter-spacing:-.02em}
.stat .k{font-size:10.5px;color:var(--faint);font-weight:650;text-transform:uppercase;letter-spacing:.05em;margin-top:1px}

svg.chart{display:block;width:100%;height:auto;overflow:visible}
.sugg{display:flex;align-items:center;gap:10px;margin:0 10px 2px;padding:9px 11px;border-radius:12px;
  background:var(--surface2);border:1px solid var(--line)}
.sugg .t{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.sugg .p{font-size:11px;color:var(--faint);font-weight:600;margin-top:1px}
.idx.warm{color:#ffd166;font-weight:800}
.setgrid button.idx{padding:8px 0;border-radius:8px}
.clockcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-bottom:12px}
.clockcard .big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.clockcard .lb{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.restgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.restgrid button{padding:16px 6px;font-size:17px;font-weight:700;border-radius:13px;
  background:var(--surface2);border:1px solid var(--line)}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;background:#0b0b0c;
  transition:opacity .45s ease;background-size:cover;background-position:center}
#splash.gone{opacity:0;pointer-events:none}
#splash .veil{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 40%,rgba(0,0,0,.25),rgba(0,0,0,.82)),
  linear-gradient(180deg,#26282b,#0a0a0b)}
#splash.hasimg .veil{background:radial-gradient(120% 80% at 50% 40%,rgba(0,0,0,.2),rgba(0,0,0,.72))}
#splash .logo{position:relative;width:150px;height:150px;border-radius:26px;
  background:linear-gradient(180deg,#4a4c50 0%,#121314 48%,#000 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 70px rgba(255,255,255,.22),0 20px 50px rgba(0,0,0,.7);}
#splash .logo svg{width:104px;height:104px;display:block}
#splash .brand{position:relative;font-size:30px;font-weight:800;letter-spacing:-.01em;color:#fff}

/* ---------- ficha de usuario ---------- */
.profcard{display:flex;align-items:center;gap:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:18px;width:100%;text-align:left}
.profcard .face{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:31px;overflow:hidden}
.profcard .face img{width:100%;height:100%;object-fit:cover}
.profcard .nm{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.profcard .mt{font-size:13.5px;color:var(--muted);font-weight:650;margin-top:3px}
.profcard .mt b{color:var(--text);font-weight:700}

/* ---------- títulos de día ---------- */
.day{margin:22px 0 10px}
.day h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.day .rule{height:3px;background:#fff;border-radius:2px;margin-top:5px;width:62%;max-width:230px}
.day:first-child{margin-top:4px}

/* ---------- ejercicio desplegable ---------- */
.exrow{width:100%;display:flex;align-items:center;gap:9px;padding:9px 2px;text-align:left}
.exrow .t{font-size:18px;font-weight:700;flex:1;min-width:0}
.exrow .car{font-size:12px;color:var(--muted);transition:transform .18s}
.exrow.open .car{transform:rotate(180deg)}
.vars{padding:0 2px 6px 16px;display:flex;flex-direction:column;gap:2px}
.vars button{text-align:left;padding:6px 4px;font-size:16.5px;font-weight:650;color:var(--text);
  display:flex;align-items:center;gap:9px}
.vars button:before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;flex:none}
.vars button .k{font-size:12px;color:var(--faint);font-weight:650;margin-left:auto}
.vars .none{font-size:13.5px;color:var(--faint);padding:4px}
.varchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--muted)}
.varchip.set{background:#fff;color:#000;border-color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(84px + var(--safe-b));
  background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:11px 16px;border-radius:11px;
  font-size:14px;font-weight:600;z-index:60;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:#ffc9c9;
  border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
.banner.warn{background:rgba(255,196,0,.08);border-color:rgba(255,196,0,.28);color:#ffe08a}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;
  animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.fadein{animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="splash"><div class="veil"></div><div class="logo"><svg viewBox="0 0 512 512" aria-hidden="true"><g transform="translate(256,256) scale(.92) skewX(-13) translate(-256,-256)"><path d="M 96,382 V130 H168 L256,268 L344,130 H416 V382 H360 V222 L256,374 L152,222 V382 Z" fill="#fff"/></g></svg></div><div class="brand">Melengym</div></div>
<div id="app">
  <header class="top"><div class="top-row"><h1 id="title">Melengym</h1><div id="headact" class="row"></div></div><div class="sub" id="subtitle"></div></header>
  <main id="view"><div class="spin"></div></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="layer"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";

const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
let MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function t(s){ if(LANG==="es"||!s)return s; const e=L[s]; if(!e)return s;

const CAL={

const IDIOMAS=[["es","Español"],["va","Valencià"],["en","English"]];
function aplicaIdioma(){
  const c=CAL[LANG]||CAL.es; MES=c.m; DIAS=c.d;
  try{ document.documentElement.lang = (LANG==="va"?"ca-valencia":LANG); }catch(e){}
}
function idiomaInicial(){
  const st=getDoc("settings");
  if(st&&st.lang&&CAL[st.lang]) return st.lang;
  const n=(navigator.language||navigator.userLanguage||"es").toLowerCase();
  if(n.indexOf("ca")===0||n.indexOf("va")===0) return "va";
  if(n.indexOf("es")===0||n.indexOf("gl")===0||n.indexOf("eu")===0) return "es";
  return "en";
}
function setLang(k){
  if(!CAL[k])return;
  LANG=k; aplicaIdioma();
  const st=settings(); st.lang=k; put(st);
}
function fDate(iso,long){ if(!iso)return"";const[y,m,d]=iso.split("-").map(Number);
  const dt=new Date(y,m-1,d); const hoy=todayISO();
  if(iso===hoy)return t("Hoy"); 
  const ay=new Date();ay.setDate(ay.getDate()-1);
  if(iso===new Date(ay.getTime()-ay.getTimezoneOffset()*6e4).toISOString().slice(0,10))return t("Ayer");
  return (long?DIAS[dt.getDay()]+" ":"")+d+" "+MES[m-1]+(y!==new Date().getFullYear()?" "+y:"");}
function fDur(ms){ if(!ms||ms<0)return"—"; const m=Math.round(ms/6e4);
  return m<60?m+" min":Math.floor(m/60)+"h "+String(m%60).padStart(2,"0");}
function fNum(n,d){ if(n===null||n===undefined||isNaN(n))return"—";
  const r=Math.round(n*(d?10**d:1))/(d?10**d:1);
  return String(r).replace(".",",");}

function put(doc,opts){

const pushTimers=new Map();
function schedulePush(id,debounce){
  if(pushTimers.has(id))clearTimeout(pushTimers.get(id));
  pushTimers.set(id,setTimeout(()=>{pushTimers.delete(id);flush();}, debounce?1200:120));
}
let flushing=false;
async function flush(){
  if(flushing)return;
  if(CLOUD.lista()){
    flushing=true;
    try{ await CLOUD.subir(); CLOUD.ultimoError=""; }
    catch(e){ CLOUD.ultimoError=e.message||String(e); }
    finally{ flushing=false; saveLocal(); renderSyncState(); }
    return;
  }
  if(!S.db||!S.uid||!S.canWrite)return;
  flushing=true;
  try{
    const col=S.db.collection("data/users/"+S.uid);
    for(const id of [...S.queue]){
      const d=S.docs.get(id); if(!d){S.queue.delete(id);continue;}
      try{
        if(d.deleted) await col.doc(id).delete();
        else await col.doc(id).set(JSON.parse(JSON.stringify(d)));
        S.queue.delete(id);
        if(d.deleted) S.docs.delete(id);
      }catch(err){
        const c=err&&err.code;
        if(c==="invalid_argument"){ S.canWrite=false; renderSyncState();
          toast(t("No se puede guardar en la nube (permisos)")); break; }
        if(c==="quota_exceeded"){ toast(t("Base de datos llena")); break; }
        break; // unavailable / red: reintentamos luego
      }
    }
    saveLocal(); renderSyncState();
  } finally { flushing=false; }
}

async function boot(){
  loadLocalAnon();
  const use = n => (window.claude && typeof claude.use==="function")
      ? Promise.resolve(claude.use(n)).catch(()=>null) : Promise.resolve(null);
  const user = await use("user");
  S.user=user;
  let id=null;
  if(user&&user.id){ try{ id=await user.id(); }catch(e){} }
  S.uid=id;
  S.docs.clear(); S.queue.clear();
  loadLocal();
  LANG=idiomaInicial(); aplicaIdioma();
  S.loaded=true; render();
  hydrateLocalImages();
  if(CLOUD.lista()){
    CLOUD.sincronizar();
    setInterval(()=>{ if(navigator.onLine) CLOUD.sincronizar(); },90000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) CLOUD.sincronizar(); });
  }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  if(!id){ S.dbReady=false; renderSyncState(); return; }
  const db = await use("db");
  S.db=db;
  const assets = await use("assets");
  S.assets=assets;
  if(!db){ renderSyncState(); return; }

  const col=db.collection("data/users/"+id);
  let timer=setTimeout(()=>{ if(!S.dbReady){ renderSyncState("lento"); } },10000);
  col.onSnapshot(snap=>{
    clearTimeout(timer); S.dbReady=true;
    let changed=false;
    for(const ds of snap.docs){
      const remote=ds.data(); if(!remote||!remote.id)continue;
      const local=S.docs.get(remote.id);
      if(S.queue.has(remote.id))continue;            // lo nuestro aún sin subir manda
      if(!local||(remote.updatedAt||0)>(local.updatedAt||0)){ S.docs.set(remote.id,remote); changed=true; }
    }
    for(const ch of snap.docChanges()){
      if(ch.type==="removed"&&!S.queue.has(ch.doc.id)){ S.docs.delete(ch.doc.id); changed=true; }
    }
    if(changed){saveLocal();render();} else renderSyncState();
    flush();
  }, err=>{
    clearTimeout(timer); S.dbReady=false;
    if(err&&err.code==="revoked") S.canWrite=false;
    renderSyncState();
  });
}

    return new Promise((res,rej)=>{ let r;
      try{ r=indexedDB.open("melengym",1); }catch(e){ rej(e); return; }

    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async get(k){ const db=await IDB.open(); return new Promise((res,rej)=>{
    const t=db.transaction("img","readonly"); const q=t.objectStore("img").get(k);
    q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); },
  async del(k){ try{ const db=await IDB.open(); const t=db.transaction("img","readwrite");

/* ============================ cálculos ============================ */
const e1rm=(w,r)=> (!w||!r)?0 : (r===1? w : w*(1+r/30));   // Epley
function resumenEntreno(st){
  const p=[];
  if(st.sets) p.push(st.sets+" series · "+fNum(st.vol)+" kg");
  if(st.cardio) p.push(fMin(st.min)+(st.km?" · "+fNum(st.km,2)+" km":""));
  return p.join("  ·  ")||t("sin registros");
}
function workoutStats(w){
  let vol=0,sets=0,reps=0,min=0,km=0,cardio=0;
  for(const en of (w.entries||[])){
    if(esCardio(getDoc(en.exerciseId))){
      for(const s of (en.sets||[])){ if(!s.done)continue; cardio++; min+=+s.t||0; km+=+s.d||0; }
      continue;
    }
    for(const s of (en.sets||[])){
      if(!s.done||s.warm)continue; sets++; reps+=(+s.r||0); vol+=(+s.w||0)*(+s.r||0);
    }
  }
  return {vol,sets,reps,min,km,cardio,
    dur:(w.endedAt&&w.startedAt)?(w.endedAt-w.startedAt-(w.pausedMs||0)):0};
}
function exHistory(exId,variant){
  const out=[];
  const card=esCardio(getDoc(exId));
  for(const w of allOf("workout")){
    if(w.status==="active")continue;
    for(const en of (w.entries||[])){
      if(en.exerciseId!==exId)continue;
      if(variant&&(en.variant||"")!==variant)continue;
      if(card){
        let min=0,km=0,n=0,lvl=0;
        for(const s of en.sets||[]){ if(!s.done)continue; n++;
          min+=+s.t||0; km+=+s.d||0; if(+s.lvl>lvl)lvl=+s.lvl; }
        if(n) out.push({date:w.date,min,km,lvl,ritmo:ritmoDe(min,km),sets:n,
          bestW:0,best1rm:0,vol:0,workoutId:w.id,variant:en.variant||""});
        continue;
      }
      let bw=0,b1=0,vol=0,n=0;
      for(const s of en.sets||[]){ if(!s.done||s.warm)continue; n++;
        const ww=+s.w||0, rr=+s.r||0; vol+=ww*rr;
        if(ww>bw)bw=ww; const e=e1rm(ww,rr); if(e>b1)b1=e; }
      if(n) out.push({date:w.date,bestW:bw,best1rm:b1,vol,sets:n,workoutId:w.id,variant:en.variant||""});
    }
  }
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function lastEntryFor(exId,variant,excludeId){
  let best=null;
  for(const w of allOf("workout")){
    if(w.status==="active"||w.id===excludeId)continue;
    for(const en of (w.entries||[])){
      if(en.exerciseId!==exId)continue;
      if(variant&&(en.variant||"")!==variant)continue;
      const utiles=(en.sets||[]).filter(s=>s.done&&!s.warm);
      if(!utiles.length)continue;
      if(!best||w.date>best.date) best={date:w.date,sets:utiles,variant:en.variant||""};
    }
  }
  return best;
}
function sesiones(exId,variant){
  const out=[];
  for(const w of allOf("workout")){
    if(w.status==="active")continue;
    for(const en of (w.entries||[])){
      if(en.exerciseId!==exId)continue;
      if(variant&&(en.variant||"")!==variant)continue;
      const ss=(en.sets||[]).filter(s=>s.done&&!s.warm&&(+s.r||0)>0);
      if(ss.length) out.push({date:w.date,sets:ss});
    }
  }
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function rangoObjetivo(txt){
  if(!txt) return null;
  const m=String(txt).match(/(\d+)\s*[-\u2013a]\s*(\d+)/);
  if(m) return [+m[1],+m[2]];
  const n=String(txt).match(/(\d+)/);
  return n?[+n[1],+n[1]]:null;
}
function sugerencia(exId,variant,objetivo){
  if(esCardio(getDoc(exId))) return null;
  const ses=sesiones(exId,variant);
  if(!ses.length) return null;
  const ex=getDoc(exId);
  const inc=(ex&&+ex.inc>0)?+ex.inc:2.5;
  const u=ses[ses.length-1];
  const base=Math.max(...u.sets.map(s=>+s.w||0));
  const repsBase=u.sets.filter(s=>(+s.w||0)===base).map(s=>+s.r||0);
  const minReps=Math.min(...repsBase);
  const rango=rangoObjetivo(objetivo);
  if(rango){
    const rmin=rango[0], rmax=rango[1];
    if(minReps>=rmax) return {w:base+inc,r:rmin,por:t("cerraste el rango la última vez")};
    return {w:base,r:Math.min(rmax,minReps+1),por:t("mismo peso, una repetición más")};
  }
  if(ses.length>=2){
    const a=ses[ses.length-2];
    const baseA=Math.max(...a.sets.map(s=>+s.w||0));
    const minA=Math.min(...a.sets.filter(s=>(+s.w||0)===baseA).map(s=>+s.r||0));
    if(base>=baseA&&minReps>=minA) return {w:base+inc,r:minReps,por:t("dos sesiones seguidas cumpliendo")};
  }
  return {w:base,r:minReps+1,por:t("consolida el peso antes de subir")};
}
function prFor(exId,variant){
  const h=exHistory(exId,variant);
  if(esCardio(getDoc(exId))){
    let km=0,min=0,rt=0;
    for(const x of h){ if(x.km>km)km=x.km; if(x.min>min)min=x.min;
      if(x.ritmo>0&&(rt===0||x.ritmo<rt))rt=x.ritmo; }
    return {w:0,o:0,km,min,ritmo:rt};
  }
  let w=0,o=0;
  for(const x of h){ if(x.bestW>w)w=x.bestW; if(x.best1rm>o)o=x.best1rm; }
  return {w,o,km:0,min:0,ritmo:0}; }
function varsOf(e){ return (e&&Array.isArray(e.variants))?e.variants.filter(Boolean):[]; }
function esCardio(ex){ return !!(ex&&ex.kind==="cardio"); }
function ritmoDe(min,km){ return (min>0&&km>0)? min/km : 0; }
function fRitmo(r){ if(!r||!isFinite(r)||r<=0)return "—";
  const m=Math.floor(r), sg=Math.round((r-m)*60);
  return (sg===60? (m+1)+":00" : m+":"+String(sg).padStart(2,"0"))+" /km"; }
function fMin(m){ if(!m)return "—"; if(m<60)return fNum(m,0)+" min";
  return Math.floor(m/60)+"h "+String(Math.round(m%60)).padStart(2,"0"); }
function profile(){ return getDoc("profile")||{id:"profile",type:"profile",name:"",altura:"",peso:"",face:"💪"}; }
function activeWorkout(){ return allOf("workout").find(w=>w.status==="active")||null; }
function exName(id){ const e=getDoc(id); return e?e.name:t("Ejercicio"); }

    else { txt=t("Sincronizado"); color="var(--muted)"; }

let _wl=null;
function necesitaPantalla(){
  if(settings().awake===false) return false;
  return !!(activeWorkout()||S.rest);
}
async function keepAwake(on){
  try{
    if(on){ if(!_wl&&"wakeLock" in navigator){ _wl=await navigator.wakeLock.request("screen");
      if(_wl&&_wl.addEventListener) _wl.addEventListener("release",()=>{_wl=null;}); } }
    else if(_wl){ const x=_wl; _wl=null; await x.release(); }
  }catch(e){ _wl=null; }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&necesitaPantalla()) keepAwake(true); });
let restTick=null;
function startRest(sec){
  S.rest={end:Date.now()+sec*1000,dur:sec};
  if(restTick)clearInterval(restTick);
  restTick=setInterval(renderRestBar,250);
  renderRestBar();
}
function stopRest(){ S.rest=null; if(restTick){clearInterval(restTick);restTick=null;} renderRestBar(); }
function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const a=new C(); const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value=880; o.type="sine";
    g.gain.setValueAtTime(.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.5);
    o.start(); o.stop(a.currentTime+.55);
  }catch(e){}
}
function renderRestBar(){
  const old=document.getElementById("restbar"); if(old)old.remove();
  if(!S.rest)return;
  const left=Math.max(0,Math.round((S.rest.end-Date.now())/1000));
  if(left===0&&!S.rest.done){ S.rest.done=true; beep(); if(navigator.vibrate)navigator.vibrate([120,60,120]); }
  const mm=String(Math.floor(left/60)),ss=String(left%60).padStart(2,"0");
  const bar=el("div",{class:"actionbar",id:"restbar"},
    el("div",{class:"inner"},
      el("div",{class:"grow"},
        el("div",{class:"timer-num num",text:(left===0?t("¡Vamos!"):mm+":"+ss)}),
        el("div",{class:"xs faint",text:left===0?t("descanso terminado"):t("descanso")})),
      el("button",{class:"btn sm",onclick:()=>{
        S.rest.end=Math.max(Date.now(),S.rest.end-15000);renderRestBar();}},"−15s"),
      el("button",{class:"btn sm",onclick:()=>{S.rest.end+=15000;S.rest.done=false;renderRestBar();}},"+15s"),
      el("button",{class:"btn sm primary",onclick:stopRest},t("Saltar"))));
  document.body.appendChild(bar);
}

function newWorkout(routine){
  const w={id:"wo_"+uid8(),type:"workout",status:"active",date:todayISO(),
    name:routine?routine.name:t("Entreno libre"),routineId:routine?routine.id:null,
    startedAt:Date.now(),endedAt:null,notes:"",entries:[]};
  if(routine) for(const it of routine.items||[]){
    const card=esCardio(getDoc(it.exerciseId));
    const sets=[]; const n=card?1:Math.max(1,+it.sets||3);
    for(let i=0;i<n;i++) sets.push(card?{t:"",d:"",lvl:"",done:false}:{w:"",r:"",done:false});
    w.entries.push({exerciseId:it.exerciseId,variant:it.variant||"",sets,
      target:it.reps||"",note:it.note||""});
  }
  put(w); go("train");
}
function finishWorkout(w){
  const st=workoutStats(w);
  if(st.sets===0&&!st.cardio){ confirmSheet(t("Entreno vacío"),t("No has marcado ninguna serie. ¿Descartarlo?"),
    ()=>{removeDoc(w.id);toast(t("Entreno descartado"));},t("Descartar")); return; }
  w.entries=(w.entries||[]).map(en=>({...en,sets:(en.sets||[]).filter(s=>s.done)}))
                           .filter(en=>en.sets.length);
  const prs=[];
  for(const en of w.entries){
    const prev=prFor(en.exerciseId,en.variant); let bw=0;
    for(const s of en.sets){ if(s.warm)continue; const ww=+s.w||0; if(ww>bw)bw=ww; }
    if(bw>prev.w&&prev.w>0) prs.push(exName(en.exerciseId));
  }
  w.status="done"; w.endedAt=Date.now(); put(w);
  stopRest();
  toast(prs.length? t("¡Récord en ")+prs[0]+"!" : t("Entreno guardado · ")+fNum(st.vol)+t(" kg de volumen"));
  go("history");
}

function fClock(ms){
  if(!ms||ms<0)ms=0; const t=Math.floor(ms/1000);
  const h=Math.floor(t/3600), m=Math.floor((t%3600)/60), sg=t%60;
  return (h? h+":"+String(m).padStart(2,"0") : String(m))+":"+String(sg).padStart(2,"0");
}
function elapsed(w){

}

function modoDescanso(){
  const st=settings();
  if(st.restMode) return st.restMode;
  return st.autoRest===false ? "off" : "ask";
}
function restDe(ex){
  if(ex&&+ex.rest>0) return +ex.rest;
  return settings().rest||120;
}
function sheetRestPick(ex,tras){
  const favorito=restDe(ex);
  const opciones=[...new Set([favorito,45,60,90,120,180])].sort((a,b)=>a-b);
  const etiqueta=sec=> sec<60? sec+"s" : (sec%60===0? (sec/60)+" min" : Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"));
  sheet(t("¿Cuánto descansas?"),(b,close)=>{
    if(ex) b.appendChild(el("p",{class:"sm muted",style:"margin:0 0 12px",
      text:t("Se guardará como tu descanso habitual en ")+ex.name+"."}));
    const g=el("div",{class:"restgrid"});
    for(const sec of opciones){
      const esFav=sec===favorito;
      g.appendChild(el("button",{style:esFav?"background:#fff;color:#000;border-color:#fff":"",
        onclick:()=>{ if(ex&&+ex.rest!==sec){ ex.rest=sec; put(ex,{silent:true}); }
          close(); startRest(sec); if(tras)tras(sec); }},etiqueta(sec)));
    }
    b.appendChild(g);
    const n=el("input",{type:"number",inputmode:"numeric",placeholder:"segundos"});
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Otro tiempo")}),n));
    b.appendChild(el("button",{class:"btn primary full big",style:"margin-bottom:9px",onclick:()=>{
      const sec=Math.max(5,+n.value||0); if(!n.value){toast(t("Pon los segundos"));return;}
      if(ex){ ex.rest=sec; put(ex,{silent:true}); }
      close(); startRest(sec); if(tras)tras(sec);
    }},svgI(ICO.play),t("Empezar")));
    b.appendChild(el("button",{class:"btn full ghost",onclick:()=>{close(); if(tras)tras(0);}},t("Sin descanso")));
  });
}
function sheetRest(){
  sheet(t("Descanso"),(b,close)=>{
    const g=el("div",{class:"restgrid"});
    for(const sec of [30,45,60,90,120,180]) g.appendChild(el("button",{onclick:()=>{
      startRest(sec); close(); }},
      sec<60? sec+"s" : (sec%60===0? (sec/60)+" min" : Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"))));
    b.appendChild(g);
    const n=el("input",{type:"number",inputmode:"numeric",placeholder:"segundos"});
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Otro tiempo")}),n));
    b.appendChild(el("button",{class:"btn primary full big",style:"margin-bottom:14px",onclick:()=>{
      const sec=Math.max(5,+n.value||0); if(!n.value){toast(t("Pon los segundos"));return;}
      startRest(sec); close();
    }},svgI(ICO.play),t("Empezar")));
    b.appendChild(el("div",{class:"sec-title",text:t("Al marcar una serie")}));
    const modo=modoDescanso();
    const opt=(k,txt,sub)=>el("button",{class:"btn full",style:"margin-bottom:9px;text-align:left",
      onclick:()=>{ setSetting("restMode",k); close(); toast(t("Guardado")); }},
      el("div",{class:"grow",style:"text-align:left"},
        el("div",{text:(modo===k?"✓ ":"")+txt}),
        el("div",{class:"xs faint",text:sub})));
    b.appendChild(opt("ask",t("Preguntar cuánto descanso"),t("Eliges el tiempo en el momento")));
    b.appendChild(opt("auto",t("Empezar solo"),t("Usa el descanso habitual de cada ejercicio")));
    b.appendChild(opt("off",t("No hacer nada"),t("Lo arrancas tú desde este botón")));
  });
}
function sheetWorkoutOpts(w){
  sheet(t("Opciones del entreno"),(b,close)=>{
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Nombre")}),
      el("input",{type:"text",value:w.name,oninput:e=>{w.name=e.target.value;put(w,{silent:true,debounce:true});}})));
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Fecha")}),
      el("input",{type:"date",value:w.date,onchange:e=>{w.date=e.target.value||todayISO();put(w,{silent:true});}})));
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Notas")}),
      el("textarea",{oninput:e=>{w.notes=e.target.value;put(w,{silent:true,debounce:true});},text:w.notes||""})));
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Descanso por defecto (segundos)")}),
      el("input",{type:"number",inputmode:"numeric",value:settings().rest,
        onchange:e=>setSetting("rest",Math.max(0,+e.target.value||0))})));
    const aw=settings().awake!==false;
    b.appendChild(el("button",{class:"btn full",style:"margin-bottom:9px",onclick:()=>{
      setSetting("awake",!aw); close();
      toast(!aw?t("La pantalla se mantendrá encendida"):t("La pantalla se apagará normalmente"));
    }},(aw?"✓ ":"")+t("Mantener la pantalla encendida entrenando")));
    if((w.entries||[]).length){
      b.appendChild(el("button",{class:"btn full",style:"margin-bottom:9px",onclick:()=>{
        close();
        sheet(t("Guardar como rutina"),(bb,cl)=>{
          const inp=el("input",{type:"text",value:w.name,placeholder:t("Nombre de la rutina")});
          bb.appendChild(el("label",{class:"fld"},el("span",{text:t("Nombre")}),inp));
          bb.appendChild(el("button",{class:"btn primary full big",onclick:()=>{
            const r={id:"rt_"+uid8(),type:"routine",name:inp.value.trim()||w.name,
              items:(w.entries||[]).map(en=>({exerciseId:en.exerciseId,variant:en.variant||"",sets:(en.sets||[]).length,
                reps:(en.sets&&en.sets[0]&&en.sets[0].r)||"",note:en.note||""})),lastUsed:Date.now()};
            put(r); cl(); toast(t("Rutina guardada"));
          }},t("Guardar rutina")));
        });
      }},svgI(ICO.copy),t("Guardar como rutina")));
    }
    b.appendChild(el("button",{class:"btn full danger",onclick:()=>{close();
      confirmSheet(t("Descartar entreno"),t("Se perderá todo lo registrado en esta sesión."),
        ()=>{removeDoc(w.id);stopRest();toast(t("Entreno descartado"));},t("Descartar"));
    }},svgI(ICO.trash),t("Descartar entreno")));
  });
}

function exerciseBlock(w,en,ei){
  const ex=getDoc(en.exerciseId);
  if(esCardio(ex)) return cardioBlock(w,en,ei,ex);
  const vs=varsOf(ex);
  const prev=lastEntryFor(en.exerciseId,en.variant,w.id);
  const pr=prFor(en.exerciseId,en.variant);
  const box=el("div",{class:"ex-block"});
  const sub=el("div",{class:"xs",style:"color:var(--muted)",
    text:(prev? fDate(prev.date)+": "+prev.sets.map(s=>fNum(+s.w)+"×"+s.r).join("  ")
              : t("Primera vez que lo haces"))
        +(en.target?"   ·   objetivo "+en.target+" reps":"")
        +(pr.w?"   ·   PR "+fNum(pr.w)+" kg":"")});
  const titulo=el("div",{class:"grow"},el("div",{class:"nm ellip",text:ex?ex.name:t("Ejercicio borrado")}),sub);
  if(vs.length) titulo.insertBefore(el("div",{style:"margin:3px 0 4px"},
      el("button",{class:"varchip"+(en.variant?" set":""),onclick:()=>pickVariant(ex,en.variant,val=>{
        en.variant=val; put(w);
      })},en.variant||t("Elegir variante")," ▾")),sub);
  box.appendChild(el("div",{class:"ex-head"},titulo,
    el("button",{class:"iconbtn",onclick:()=>sheetExOpts(w,en,ei)},svgI(ICO.gear))));
  const sg=sugerencia(en.exerciseId,en.variant,en.target);
  if(sg && !(en.sets||[]).some(x=>x.done&&!x.warm)){
    box.appendChild(el("div",{class:"sugg"},
      el("div",{class:"t"},el("div",{text:t("Hoy: ")+fNum(sg.w,1)+" kg × "+sg.r+" reps"}),
        el("div",{class:"p",text:sg.por})),
      el("button",{class:"btn sm primary",onclick:()=>{
        for(const x of en.sets||[]){ if(x.done||x.warm)continue; x.w=String(sg.w); x.r=String(sg.r); }
        put(w); toast(t("Series rellenadas"));
      }},t("Usar"))));
  }
  box.appendChild(el("div",{class:"setgrid head"},
    el("div",{class:"idx",text:"#"}),el("div",{class:"prev",style:"font-size:11px",text:t("Anterior")}),
    el("div",{class:"center",text:"kg"}),el("div",{class:"center",text:"reps"}),el("div")));
  (en.sets||[]).forEach((s,si)=>{
    const p=prev&&prev.sets[si];
    const kg=el("input",{type:"text",inputmode:"decimal",value:s.w===0?"0":(s.w||""),
      placeholder:p?fNum(+p.w):"—",
      oninput:e=>{s.w=e.target.value.replace(",",".");put(w,{silent:true,debounce:true});}});
    const rp=el("input",{type:"text",inputmode:"numeric",value:s.r||"",
      placeholder:p?String(p.r):(en.target||"—"),
      oninput:e=>{s.r=e.target.value;put(w,{silent:true,debounce:true});}});
    const ck=el("button",{class:"ck"+(s.done?" on":""),onclick:()=>{
      s.done=!s.done;
      if(s.done){
        if(s.w===""||s.w===undefined) s.w=kg.value||(p?p.w:"");
        if(s.r===""||s.r===undefined) s.r=rp.value||(p?p.r:"");
        const modo=modoDescanso();
        if(modo==="ask"){ put(w); sheetRestPick(ex); return; }
        if(modo==="auto"){ const rs=restDe(ex); if(rs>0) startRest(rs); }
      }
      put(w);
    }},svgI(ICO.check));
    const celdaPrev = p
      ? el("button",{class:"prev",title:t("Usar estos valores"),onclick:()=>{
          s.w=p.w; s.r=p.r; kg.value=p.w; rp.value=p.r; put(w,{silent:true}); toast(t("Copiado del último entreno"));
        }},fNum(+p.w)+"×"+p.r)
      : el("div",{class:"prev nada",text:"—"});
    const nSerie=(en.sets||[]).slice(0,si+1).filter(x=>!x.warm).length;
    const idx=el("button",{class:"idx"+(s.warm?" warm":""),title:t("Marcar como calentamiento"),
      onclick:()=>{ s.warm=!s.warm; put(w);
        toast(s.warm?t("Serie de calentamiento: no cuenta para récords"):t("Serie normal")); }},
      s.warm?"C":String(nSerie));
    box.appendChild(el("div",{class:"setgrid"+(s.done?" row-done":"")},
      idx, celdaPrev, kg,rp,ck));
  });
  box.appendChild(el("div",{class:"ex-foot"},
    el("button",{class:"btn sm grow",onclick:()=>{
      const last=(en.sets||[])[en.sets.length-1];
      en.sets.push({w:last?last.w:"",r:last?last.r:"",done:false}); put(w);
    }},svgI(ICO.plus),t("Serie")),
    (en.sets||[]).length>1?el("button",{class:"btn sm",onclick:()=>{en.sets.pop();put(w);}},t("Quitar")):null));
  return box;
}
function cardioBlock(w,en,ei,ex){
  const vs=varsOf(ex);
  const prev=lastEntryFor(en.exerciseId,en.variant,w.id);
  const pr=prFor(en.exerciseId,en.variant);
  const box=el("div",{class:"ex-block"});
  let pmin=0,pkm=0;
  if(prev) for(const s of prev.sets){ pmin+=+s.t||0; pkm+=+s.d||0; }
  const partes=[];
  partes.push(prev? fDate(prev.date)+": "+fMin(pmin)+(pkm?" · "+fNum(pkm,2)+" km":"")
                    +(ritmoDe(pmin,pkm)?" · "+fRitmo(ritmoDe(pmin,pkm)):"")
                  : t("Primera vez que lo haces"));
  if(pr.km) partes.push("mejor "+fNum(pr.km,2)+" km");
  if(pr.ritmo) partes.push(t("ritmo ")+fRitmo(pr.ritmo));
  const sub=el("div",{class:"xs",style:"color:var(--muted)",text:partes.join("   ·   ")});
  const titulo=el("div",{class:"grow"},el("div",{class:"nm ellip",text:ex.name}),sub);
  if(vs.length) titulo.insertBefore(el("div",{style:"margin:3px 0 4px"},
      el("button",{class:"varchip"+(en.variant?" set":""),onclick:()=>pickVariant(ex,en.variant,val=>{
        en.variant=val; put(w);
      })},en.variant||t("Elegir variante")," ▾")),sub);
  box.appendChild(el("div",{class:"ex-head"},titulo,
    el("button",{class:"iconbtn",onclick:()=>sheetExOpts(w,en,ei)},svgI(ICO.gear))));
  box.appendChild(el("div",{class:"setgrid cardio head"},
    el("div",{class:"idx",text:"#"}),
    el("div",{class:"center",text:"min"}),
    el("div",{class:"center",text:"km"}),
    el("div",{class:"center",text:t("nivel")}),el("div")));
  (en.sets||[]).forEach((s,si)=>{
    const p=prev&&prev.sets[si];
    const ti=el("input",{type:"text",inputmode:"decimal",value:s.t||"",placeholder:p?String(p.t||""):"—",
      oninput:e=>{s.t=e.target.value.replace(",",".");put(w,{silent:true,debounce:true});}});
    const di=el("input",{type:"text",inputmode:"decimal",value:s.d||"",placeholder:p?String(p.d||""):"—",
      oninput:e=>{s.d=e.target.value.replace(",",".");put(w,{silent:true,debounce:true});}});
    const li=el("input",{type:"text",inputmode:"decimal",value:s.lvl||"",placeholder:p?String(p.lvl||""):"—",
      oninput:e=>{s.lvl=e.target.value.replace(",",".");put(w,{silent:true,debounce:true});}});
    const ck=el("button",{class:"ck"+(s.done?" on":""),onclick:()=>{
      s.done=!s.done;
      if(s.done){
        if(!s.t) s.t=ti.value||(p?p.t:"");
        if(!s.d) s.d=di.value||(p?p.d:"");
        if(!s.lvl) s.lvl=li.value||(p?p.lvl:"");
      }
      put(w);
    }},svgI(ICO.check));
    box.appendChild(el("div",{class:"setgrid cardio"+(s.done?" row-done":"")},
      el("div",{class:"idx",text:String(si+1)}),ti,di,li,ck));
    const rt=ritmoDe(+s.t||0,+s.d||0);
    if(rt) box.appendChild(el("div",{class:"xs faint center",style:"margin:-4px 0 6px",
      text:t("ritmo ")+fRitmo(rt)}));
  });
  box.appendChild(el("div",{class:"ex-foot"},
    el("button",{class:"btn sm grow",onclick:()=>{
      en.sets.push({t:"",d:"",lvl:"",done:false}); put(w);
    }},svgI(ICO.plus),t("Otra serie")),
    (en.sets||[]).length>1?el("button",{class:"btn sm",onclick:()=>{en.sets.pop();put(w);}},t("Quitar")):null));
  return box;
}
function pickVariant(ex,actual,cb){
  const vs=varsOf(ex);
  sheet(t("Variante de ")+(ex?ex.name:"ejercicio"),(b,close)=>{
    for(const vv of vs) b.appendChild(el("button",{class:"btn full big"+(vv===actual?" primary":""),
      style:"margin-bottom:9px",onclick:()=>{close();cb(vv);}},vv));
    b.appendChild(el("button",{class:"btn full ghost",style:"margin-bottom:9px",
      onclick:()=>{close();cb("");}},t("Sin variante")));
    b.appendChild(el("button",{class:"btn full",onclick:()=>{
      close();
      sheet(t("Nueva variante"),(bb,cl)=>{
        const i=el("input",{type:"text",placeholder:t("Ej: Polea")});
        bb.appendChild(el("label",{class:"fld"},el("span",{text:t("Nombre de la variante")}),i));
        bb.appendChild(el("button",{class:"btn primary full big",onclick:()=>{
          const val=i.value.trim(); if(!val){toast(t("Ponle nombre"));return;}
          if(ex){ ex.variants=varsOf(ex).concat([val]); put(ex,{silent:true}); }
          cl(); cb(val);
        }},t("Añadir")));
      });
    }},svgI(ICO.plus),t("Nueva variante")));
  });
}
function sheetExOpts(w,en,ei){
  const ex=getDoc(en.exerciseId);
  sheet(exName(en.exerciseId),(b,close)=>{
    if(varsOf(ex).length) b.appendChild(el("button",{class:"btn full",style:"margin-bottom:9px",
      onclick:()=>{close();pickVariant(ex,en.variant,val=>{en.variant=val;put(w);});}},
      t("Variante: ")+(en.variant||"ninguna")));
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Nota de este ejercicio")}),
      el("input",{type:"text",value:en.note||"",placeholder:t("Ej: banco inclinado 30°"),
        oninput:e=>{en.note=e.target.value;put(w,{silent:true,debounce:true});}})));
    b.appendChild(el("button",{class:"btn full",style:"margin-bottom:9px",
      onclick:()=>{close();push({v:"exercise",id:en.exerciseId,variant:en.variant});}},svgI(ICO.chart),t("Ver progreso")));
    if(ei>0) b.appendChild(el("button",{class:"btn full",style:"margin-bottom:9px",onclick:()=>{
      const a=w.entries; [a[ei-1],a[ei]]=[a[ei],a[ei-1]]; put(w); close();
    }},t("Subir en la lista")));
    b.appendChild(el("button",{class:"btn full danger",onclick:()=>{
      w.entries.splice(ei,1); put(w); close();
    }},svgI(ICO.trash),t("Quitar del entreno")));
  });
}
</script>
<script>
"use strict";
/* ============================ EJERCICIOS ============================ */
const MUSC=["Pecho","Espalda","Pierna","Hombro","Bíceps","Tríceps","Core","Glúteo","Cardio","Otro"];
function createExercise(name,muscle,variants,kind){
  const e={id:"ex_"+uid8(),type:"exercise",name:name.trim(),
    muscle:(kind==="cardio"?"Cardio":(muscle||"Otro")),notes:"",kind:kind||"fuerza",
    variants:(variants||"").split(",").map(x=>x.trim()).filter(Boolean)};
  put(e); return e;
}
function sheetNewExercise(cb){
  sheet(t("Nuevo ejercicio"),(b,close)=>{
    const nm=el("input",{type:"text",placeholder:t("Ej: Press plano")});
    const sel=el("select",null,...MUSC.map(m=>el("option",{value:m,text:t(m)})));
    const vr=el("input",{type:"text",placeholder:t("Multipower, Barra, Mancuernas")});
    let kind="fuerza";
    const grupo=el("label",{class:"fld"},el("span",{text:t("Grupo muscular")}),sel);
    const tipos=el("div",{class:"row",style:"gap:8px;margin-bottom:12px"});
    const pintaTipos=()=>{ tipos.textContent="";
      for(const k of [["fuerza",t("Fuerza")],["cardio","Cardio"]])
        tipos.appendChild(el("button",{class:"chip grow"+(kind===k[0]?" on":""),
          style:"justify-content:center;padding:12px",
          onclick:()=>{ kind=k[0]; grupo.style.display=(kind==="cardio"?"none":"block");
            vr.placeholder=(kind==="cardio"?t("Cinta, Elíptica, Bici"):t("Multipower, Barra, Mancuernas"));
            pintaTipos(); }},k[1]));
    };
    pintaTipos();
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Nombre")}),nm));
    b.appendChild(el("div",{class:"fld"},el("span",{class:"xs b",
      style:"display:block;color:var(--muted);margin-bottom:6px",text:t("TIPO")}),tipos));
    b.appendChild(grupo);
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Variantes (separadas por comas, opcional)")}),vr));
    b.appendChild(el("button",{class:"btn primary full big",onclick:()=>{
      if(!nm.value.trim()){toast(t("Ponle un nombre"));return;}
      const e=createExercise(nm.value,sel.value,vr.value,kind); close(); if(cb)cb(e);
    }},t("Crear")));
    setTimeout(()=>nm.focus(),250);
  });
}
function pickExercise(cb){
  sheet(t("Añadir ejercicio"),(b,close)=>{
    const chosen=new Set();
    const search=el("input",{type:"text",placeholder:t("Buscar…"),oninput:()=>paint()});
    const list=el("div",{style:"margin-top:4px"});
    const foot=el("div",{style:"position:sticky;bottom:0;background:var(--surface);padding-top:10px"});
    const addBtn=el("button",{class:"btn primary full big",onclick:()=>{
      if(!chosen.size){toast(t("Elige al menos uno"));return;}
      close(); cb([...chosen]);
    }},t("Añadir"));
    const newBtn=el("button",{class:"btn full",style:"margin-bottom:9px",
      onclick:()=>sheetNewExercise(e=>{chosen.add(e.id);paint();})},svgI(ICO.plus),t("Crear ejercicio nuevo"));
    function paint(){
      list.textContent="";
      const q=search.value.trim().toLowerCase();
      const exs=allOf("exercise").filter(e=>!q||e.name.toLowerCase().includes(q)||
        (e.muscle||"").toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,"es"));
      if(!exs.length){
        list.appendChild(el("p",{class:"sm faint center",style:"padding:18px 0",
          text:q?t("Ningún ejercicio con ese nombre."):t("Todavía no tienes ejercicios. Crea el primero.")}));
      }
      for(const e of exs){
        const on=chosen.has(e.id);
        list.appendChild(el("button",{class:"item",style:on?"border-color:var(--accent-dim)":"",
          onclick:()=>{on?chosen.delete(e.id):chosen.add(e.id);paint();}},
          el("div",{class:"av",style:on?"background:var(--accent);color:var(--accent-ink)":""},
            on?svgI(ICO.check):el("span",{text:e.name.slice(0,1).toUpperCase()})),
          el("div",{class:"grow"},el("div",{class:"b ellip",text:e.name}),
            el("div",{class:"xs faint",text:e.muscle||""}))));
      }
      addBtn.textContent = chosen.size? t("Añadir ")+chosen.size : t("Añadir");
    }
    b.appendChild(search); b.appendChild(newBtn); b.appendChild(list);
    foot.appendChild(addBtn); b.appendChild(foot);
    paint();
  });
}
function viewExercises(v){
  head(t("Ejercicios"),allOf("exercise").length+t(" en tu lista"));
  v.appendChild(backBar(t("Días")));
  v.appendChild(el("button",{class:"btn full",style:"margin-bottom:14px",
    onclick:()=>sheetNewExercise()},svgI(ICO.plus),t("Nuevo ejercicio")));
  const exs=allOf("exercise").sort((a,b)=>(a.muscle||"").localeCompare(b.muscle||"","es")||a.name.localeCompare(b.name,"es"));
  if(!exs.length){ v.appendChild(emptyState(ICO.dumbbell,t("Sin ejercicios"),
    t("Crea los que uses: press plano, sentadilla, dominadas… y sus variantes."))); return; }
  let cur=null;
  for(const e of exs){
    if(e.muscle!==cur){ cur=e.muscle; v.appendChild(el("div",{class:"sec-title",text:t(cur||"Otro")})); }
    const h=exHistory(e.id); const pr=prFor(e.id); const vs=varsOf(e);
    v.appendChild(el("button",{class:"item",onclick:()=>push({v:"exercise",id:e.id})},
      el("div",{class:"grow"},el("div",{class:"b ellip",text:e.name}),
        el("div",{class:"sm faint ellip",text:(vs.length?vs.join(" · ")+" — ":"")+(
          !h.length? t("sin registros")
          : esCardio(e)? h.length+t(" sesiones · mejor ")+fNum(pr.km,2)+" km"

function viewExercise(v,top){

    v.appendChild(el("div",{class:"card"},barChart(h.slice(-12).map(x=>({x:x.date,y:x.vol})),"kg")));
  }
  }
  v.appendChild(el("div",{class:"sec-title",text:t("Historial")}));
  if(!h.length) v.appendChild(el("p",{class:"sm faint center",style:"padding:14px",text:t("Aún no lo has entrenado.")}));
  for(const x of [...h].reverse()){
    v.appendChild(el("button",{class:"item",onclick:()=>push({v:"workout",id:x.workoutId})},
      el("div",{class:"grow"},el("div",{class:"b",text:fDate(x.date,true)+(x.variant&&!sel?" · "+x.variant:"")}),
        el("div",{class:"sm faint",text: card
          ? fMin(x.min)+(x.km?" · "+fNum(x.km,2)+" km":"")+(x.ritmo?" · "+fRitmo(x.ritmo):"")
          : x.sets+" series · "+fNum(x.vol)+t(" kg · máx ")+fNum(x.bestW)+" kg"})),
      (card? (x.km>0&&x.km>=pr.km) : (x.bestW>=pr.w&&pr.w>0))?el("span",{class:"pill pr",text:"PR"}):null));
  }
  v.appendChild(el("div",{style:"margin-top:18px"},
    el("button",{class:"btn full",style:"margin-bottom:9px",onclick:()=>sheet(t("Editar ejercicio"),(b,close)=>{
      const nm=el("input",{type:"text",value:e.name});
      const sl=el("select",null,...MUSC.map(m=>el("option",{value:m,text:t(m)})));
      sl.value=e.muscle||"Otro";
      const vr=el("input",{type:"text",value:vs.join(", "),placeholder:t("Multipower, Barra, Mancuernas")});
      const ic=el("input",{type:"text",inputmode:"decimal",value:e.inc||"2.5",placeholder:"2.5"});
      b.appendChild(el("label",{class:"fld"},el("span",{text:t("Nombre")}),nm));
      b.appendChild(el("label",{class:"fld"},el("span",{text:t("Grupo muscular")}),sl));
      b.appendChild(el("label",{class:"fld"},el("span",{text:t("Variantes (separadas por comas)")}),vr));
      if(!card) b.appendChild(el("label",{class:"fld"},el("span",{text:t("Salto de peso al progresar (kg)")}),ic));
      b.appendChild(el("p",{class:"xs faint",style:"margin:-4px 0 12px",
        text:card?t("Ejercicio de cardio: se registra en minutos, kilómetros y nivel.")
                 :t("Ejercicio de fuerza: se registra en kilos y repeticiones.")}));
      b.appendChild(el("button",{class:"btn primary full big",onclick:()=>{
        e.name=nm.value.trim()||e.name; e.muscle=sl.value;

        e.inc=+String(ic.value).replace(",",".")||2.5;

    el("button",{class:"btn full ghost danger",onclick:()=>confirmSheet(t("Eliminar ejercicio"),
      t("El historial de entrenos que lo incluyen se mantiene, pero perderás el ejercicio de la lista."),
      ()=>{removeDoc(e.id);back();})},svgI(ICO.trash),t("Eliminar"))));
}
function stat(v,k){ return el("div",{class:"stat"},el("div",{class:"v num",text:v}),el("div",{class:"k",text:k})); }

<script>
"use strict";
/* ============================ GRÁFICAS ============================ */
const NS="http://www.w3.org/2000/svg";
function mkSvg(w,h){ const s=document.createElementNS(NS,"svg");
  s.setAttribute("viewBox","0 0 "+w+" "+h); s.setAttribute("class","chart"); return s; }
function sv(tag,attrs,text){ const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k,attrs[k]); if(text!==undefined)n.textContent=text; return n; }
function shortDate(iso){ const [y,m,d]=iso.split("-").map(Number); return d+" "+MES[m-1]; }
function axis(s,W,H,PL,PT,PB,min,max){
  for(let i=0;i<=2;i++){
    const y=PT+(H-PT-PB)*(i/2), val=max-(max-min)*(i/2);
    s.appendChild(sv("line",{x1:PL,x2:W-6,y1:y,y2:y,stroke:"#2c2f34","stroke-width":1}));
    s.appendChild(sv("text",{x:PL-6,y:y+4,"text-anchor":"end",fill:"#636a78","font-size":10},fNum(val, (max-min)<12?1:0)));
  }
}
function lineChart(pts,unit){
  const W=320,H=150,PL=38,PT=12,PB=24;
  const s=mkSvg(W,H);
  if(pts.length<2){ s.appendChild(sv("text",{x:W/2,y:H/2,"text-anchor":"middle",fill:"#636a78","font-size":12},t("Faltan datos"))); return s; }
  const ys=pts.map(p=>p.y);
  let min=Math.min(...ys),max=Math.max(...ys);
  if(max===min){max=max+1;min=Math.max(0,min-1);} else {const pad=(max-min)*.18;max+=pad;min=Math.max(0,min-pad);}
  const X=i=>PL+(W-PL-10)*(pts.length===1?.5:i/(pts.length-1));
  const Y=y=>PT+(H-PT-PB)*(1-(y-min)/(max-min));
  axis(s,W,H,PL,PT,PB,min,max);
  const d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  s.appendChild(sv("path",{d:d+" L"+X(pts.length-1)+" "+(H-PB)+" L"+X(0)+" "+(H-PB)+" Z",
    fill:"rgba(255,255,255,.12)",stroke:"none"}));
  s.appendChild(sv("path",{d,fill:"none",stroke:"#ffffff","stroke-width":2.2,
    "stroke-linejoin":"round","stroke-linecap":"round"}));
  pts.forEach((p,i)=>{ if(pts.length<=14||i===pts.length-1||i===0)
    s.appendChild(sv("circle",{cx:X(i),cy:Y(p.y),r:i===pts.length-1?4:2.6,fill:"#ffffff"})); });
  const last=pts[pts.length-1];
  s.appendChild(sv("text",{x:Math.min(W-8,X(pts.length-1)+8),y:Math.max(14,Y(last.y)-9),
    "text-anchor":"end",fill:"#eef0f4","font-size":12,"font-weight":700},fNum(last.y,1)+" "+(unit||"")));
  s.appendChild(sv("text",{x:PL,y:H-6,fill:"#636a78","font-size":10},shortDate(pts[0].x)));
  s.appendChild(sv("text",{x:W-8,y:H-6,"text-anchor":"end",fill:"#636a78","font-size":10},shortDate(last.x)));
  return s;
}
function barChart(pts,unit){
  const W=320,H=140,PL=38,PT=12,PB=24;
  const s=mkSvg(W,H);
  if(!pts.length){ s.appendChild(sv("text",{x:W/2,y:H/2,"text-anchor":"middle",fill:"#636a78","font-size":12},t("Sin datos"))); return s; }
  const max=Math.max(...pts.map(p=>p.y))*1.15||1;
  axis(s,W,H,PL,PT,PB,0,max);
  const gap=4, bw=Math.max(5,(W-PL-10-gap*(pts.length-1))/pts.length);
  pts.forEach((p,i)=>{
    const h=(H-PT-PB)*(p.y/max), x=PL+i*(bw+gap), y=H-PB-h;
    s.appendChild(sv("rect",{x,y,width:bw,height:Math.max(1,h),rx:Math.min(3,bw/3),fill:"#ffffff","fill-opacity":i===pts.length-1?1:.55}));
  });
  s.appendChild(sv("text",{x:PL,y:H-6,fill:"#636a78","font-size":10},shortDate(pts[0].x)));
  if(pts.length>1) s.appendChild(sv("text",{x:W-8,y:H-6,"text-anchor":"end",fill:"#636a78","font-size":10},shortDate(pts[pts.length-1].x)));
  return s;
}

/* ============================ RUTINAS ============================ */
function viewRoutines(v){

    v.appendChild(el("div",{class:"row",style:"gap:8px;margin-top:10px"},

        if(activeWorkout()){toast(t("Ya tienes un entreno abierto"));go("train");return;}
        r.lastUsed=Date.now(); put(r,{silent:true}); newWorkout(r);
      }},svgI(ICO.play),t("Entrenar")),

  }
  v.appendChild(el("div",{class:"row",style:"gap:8px;margin-top:24px"},

      const n=allOf("routine").length+1;
      const r={id:"rt_"+uid8(),type:"routine",name:"DIA "+n+" - ",items:[],order:n};
      put(r); push({v:"routine",id:r.id});
    }},svgI(ICO.plus),t("Nuevo día")),
    el("button",{class:"btn grow",onclick:()=>push({v:"exercises"})},svgI(ICO.dumbbell),t("Ejercicios"))));
}
function viewRoutineEdit(v,top){
  const r=getDoc(top.id);
  if(!r){ v.appendChild(backBar()); v.appendChild(emptyState(ICO.x,t("Día no encontrado"))); return; }
  head(r.name||t("Día"),(r.items||[]).length+t(" ejercicios"));

          it.variant=val; put(r);

          el("input",{type:"text",inputmode:"numeric",value:it.reps||"",placeholder:"8-10",style:"margin-top:4px",
            oninput:e=>{it.reps=e.target.value;put(r,{silent:true,debounce:true});}})),
        i>0?el("button",{class:"iconbtn",style:"align-self:flex-end",onclick:()=>{
          [r.items[i-1],r.items[i]]=[r.items[i],r.items[i-1]];put(r);}},svgI('<path d="M12 19V5M6 11l6-6 6 6"/>')):null)));
  });
  v.appendChild(el("button",{class:"btn full big",style:"margin-top:4px",onclick:()=>pickExercise(ids=>{
    for(const id of ids){ const e=getDoc(id); const vs=varsOf(e);
      r.items.push({exerciseId:id,variant:vs.length?vs[0]:"",sets:3,reps:"",note:""}); }

  v.appendChild(el("div",{style:"margin-top:18px"},

/* ============================ HISTORIAL ============================ */
function viewHistory(v){
  const ws=allOf("workout").filter(w=>w.status!=="active").sort((a,b)=>a.date<b.date?1:-1);
  head(t("Historial"),ws.length+t(" entrenos"));
  if(!ws.length){ v.appendChild(emptyState(ICO.clock,t("Sin entrenos todavía"),
    t("Cuando termines una sesión aparecerá aquí."),
    el("button",{class:"btn primary",onclick:()=>go("train")},t("Empezar un entreno")))); return; }
  // resumen del mes
  const mes=todayISO().slice(0,7);
  const delMes=ws.filter(w=>w.date.slice(0,7)===mes);
  const volMes=delMes.reduce((a,w)=>a+workoutStats(w).vol,0);
  v.appendChild(el("div",{class:"stats",style:"margin-bottom:16px"},
    stat(String(delMes.length),t("Este mes")),
    stat(fNum(Math.round(volMes/1000),1)+"t",t("Volumen mes")),
    stat(String(racha(ws)),t("Semanas seguidas"))));
  let curMes=null;
  for(const w of ws){
    const m=w.date.slice(0,7);
    if(m!==curMes){ curMes=m;
      const [y,mm]=m.split("-");
      v.appendChild(el("div",{class:"sec-title",text:MES[+mm-1].toUpperCase()+" "+y})); }
    const st=workoutStats(w);
    v.appendChild(el("button",{class:"item",onclick:()=>push({v:"workout",id:w.id})},
      el("div",{class:"av"},el("span",{text:w.date.slice(8,10)})),
      el("div",{class:"grow"},el("div",{class:"b ellip",text:w.name}),
        el("div",{class:"sm faint",text:resumenEntreno(st)+(st.dur?"  ·  "+fDur(st.dur):"")})),
      svgI(ICO.chev)));
  }
}
function racha(ws){
  if(!ws.length)return 0;
  const semana=iso=>{const d=new Date(iso);const t=new Date(d.getFullYear(),0,1);
    return d.getFullYear()+"-"+Math.ceil(((d-t)/864e5+t.getDay()+1)/7);};
  const set=new Set(ws.map(w=>semana(w.date)));
  let n=0; const hoy=new Date();
  for(let i=0;i<520;i++){ const d=new Date(hoy.getTime()-i*7*864e5);
    if(set.has(semana(d.toISOString().slice(0,10)))) n++; else if(i>0) break; }
  return n;
}
function viewWorkoutDetail(v,top){
  const w=getDoc(top.id);
  if(!w){ v.appendChild(backBar()); v.appendChild(emptyState(ICO.x,t("Entreno no encontrado"))); return; }

  if(w.notes) v.appendChild(el("div",{class:"card sm muted",text:w.notes}));
  for(const en of (w.entries||[])){
    const pr=prFor(en.exerciseId,en.variant);
    v.appendChild(el("div",{class:"ex-block"},
      el("div",{class:"ex-head"},
        el("button",{class:"grow",style:"text-align:left;padding:0",

          el("div",{class:"xs faint",text:[en.variant,en.note].filter(Boolean).join(" · ")})),

        ? el("div",{class:"setgrid",style:"grid-template-columns:28px 1fr 1fr 1fr"},
            el("div",{class:"idx",text:String(i+1)}),
            el("div",{class:"center b num",text:fMin(+s.t||0)}),
            el("div",{class:"center b num",text:(+s.d? fNum(+s.d,2)+" km":"—")}),
            el("div",{class:"center sm faint num",text:fRitmo(ritmoDe(+s.t||0,+s.d||0))}))
        : el("div",{class:"setgrid",style:"grid-template-columns:28px 1fr 1fr 44px"},
            el("div",{class:"idx"+(s.warm?" warm":""),text:s.warm?"C":String((en.sets||[]).slice(0,i+1).filter(x=>!x.warm).length)}),
            el("div",{class:"center b num",text:fNum(+s.w)+" kg"}),
            el("div",{class:"center b num",text:(s.r||"—")+" reps"}),
            (!s.warm&&+s.w>0&&+s.w>=pr.w)?el("span",{class:"pill pr",text:"PR"}):el("div")))));
  }
  v.appendChild(el("div",{style:"margin-top:16px"},
    el("button",{class:"btn full",style:"margin-bottom:9px",onclick:()=>{
      if(activeWorkout()){toast(t("Ya tienes un entreno abierto"));go("train");return;}
      const nw={id:"wo_"+uid8(),type:"workout",status:"active",date:todayISO(),name:w.name,
        routineId:w.routineId,startedAt:Date.now(),endedAt:null,notes:"",
        entries:(w.entries||[]).map(en=>({exerciseId:en.exerciseId,variant:en.variant||"",note:en.note||"",
          sets:(en.sets||[]).map(s=>({w:s.w,r:s.r,done:false}))}))};
      put(nw); go("train");
    }},svgI(ICO.copy),t("Repetir este entreno")),
    el("button",{class:"btn full ghost danger",onclick:()=>confirmSheet(t("Eliminar entreno"),
      t("Se borrará del historial y de las gráficas."),()=>{removeDoc(w.id);back();})},svgI(ICO.trash),t("Eliminar"))));
}

<script>
"use strict";
/* ============================ PROGRESO ============================ */
const METRICS=[
  {k:"peso",t:"Peso",u:"kg"},{k:"grasa",t:"Grasa",u:"%"},{k:"pecho",t:"Pecho",u:"cm"},
  {k:"cintura",t:"Cintura",u:"cm"},{k:"brazo",t:"Brazo",u:"cm"},{k:"pierna",t:"Pierna",u:"cm"},
  {k:"hombros",t:"Hombros",u:"cm"},{k:"cadera",t:"Cadera",u:"cm"},
];
let metricSel="peso";
function measures(){ return allOf("measure").sort((a,b)=>a.date<b.date?-1:1); }
function seriesFor(k){ return measures().filter(m=>m.v&&m.v[k]!==""&&m.v[k]!==undefined&&m.v[k]!==null)
  .map(m=>({x:m.date,y:+m.v[k]})).filter(p=>!isNaN(p.y)); }
function sheetMeasure(existing){
  sheet(existing?t("Editar medida"):t("Nueva medida"),(b,close)=>{
    const m = existing || {id:"ms_"+uid8(),type:"measure",date:todayISO(),v:{}};
    const dt=el("input",{type:"date",value:m.date});
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Fecha")}),dt));
    const inputs={};
    const grid=el("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:10px"});
    for(const mt of METRICS){
      const i=el("input",{type:"text",inputmode:"decimal",value:(m.v&&m.v[mt.k]!==undefined)?m.v[mt.k]:"",placeholder:"—"});
      inputs[mt.k]=i;
      grid.appendChild(el("label",{class:"fld",style:"margin:0"},el("span",{text:t(mt.t)+" ("+mt.u+")"}),i));
    }
    b.appendChild(grid);
    b.appendChild(el("button",{class:"btn primary full big",style:"margin-top:14px",onclick:()=>{
      m.date=dt.value||todayISO(); m.v=m.v||{};
      let any=false;
      for(const mt of METRICS){ const val=inputs[mt.k].value.replace(",",".").trim();
        if(val===""){ delete m.v[mt.k]; } else { m.v[mt.k]=+val; any=true; } }
      if(!any){ toast(t("Rellena al menos un dato")); return; }
      put(m); close(); toast(t("Medida guardada"));
    }},t("Guardar")));
    if(existing) b.appendChild(el("button",{class:"btn full ghost danger",style:"margin-top:9px",
      onclick:()=>{close();confirmSheet(t("Eliminar medida"),"",()=>removeDoc(existing.id));}},t("Eliminar")));
  });
}
function viewProgress(v){
  const ms=measures();
  head(t("Progreso"),t("Medidas y récords"));
  const mt=METRICS.find(x=>x.k===metricSel)||METRICS[0];
  const serie=seriesFor(metricSel);
  const last=serie[serie.length-1], first=serie[0];
  const hace30=serie.filter(p=>p.x>=new Date(Date.now()-30*864e5).toISOString().slice(0,10))[0];
  const dif = (last&&hace30)? last.y-hace30.y : null;
  v.appendChild(el("div",{class:"stats",style:"margin-bottom:14px"},
    stat(last?fNum(last.y,1)+" "+mt.u:"—",t(mt.t)+t(" hoy")),
    stat(dif===null?"—":(dif>0?"+":"")+fNum(dif,1),t("Últimos 30d")),
    stat(first&&last?(last.y-first.y>0?"+":"")+fNum(last.y-first.y,1):"—",t("Desde el inicio"))));
  const chips=el("div",{class:"chips"});
  for(const m of METRICS) chips.appendChild(el("button",{class:"chip"+(m.k===metricSel?" on":""),
    onclick:()=>{metricSel=m.k;render();}},t(m.t)));
  v.appendChild(chips);
  v.appendChild(el("div",{class:"card",style:"margin-top:10px"},
    serie.length>1?lineChart(serie,mt.u):el("p",{class:"sm faint center",style:"margin:22px 0",
      text:serie.length?t("Apunta otra medida para ver la curva."):t("Sin datos de ")+t(mt.t).toLowerCase()+t(" todavía.")})));
  v.appendChild(el("button",{class:"btn full",style:"margin-bottom:6px",onclick:()=>sheetMeasure()},
    svgI(ICO.plus),t("Añadir medida")));

  if(ms.length){
    v.appendChild(el("div",{class:"sec-title",text:t("Registro de medidas")}));
    for(const m of [...ms].reverse().slice(0,12)){
      const txt=METRICS.filter(x=>m.v&&m.v[x.k]!==undefined).map(x=>t(x.t)+" "+fNum(m.v[x.k],1)).join(" · ");
      v.appendChild(el("button",{class:"item",onclick:()=>sheetMeasure(m)},
        el("div",{class:"grow"},el("div",{class:"b",text:fDate(m.date,true)}),
          el("div",{class:"sm faint ellip",text:txt})),svgI(ICO.edit)));
    }
  }
  // récords
  const cardios=allOf("exercise").filter(e=>esCardio(e)).map(e=>({e,pr:prFor(e.id)}))
    .filter(x=>x.pr.km>0||x.pr.min>0).sort((a,b)=>b.pr.km-a.pr.km);
  if(cardios.length){
    v.appendChild(el("div",{class:"sec-title",text:"Cardio"}));
    for(const x of cardios) v.appendChild(el("button",{class:"item",onclick:()=>push({v:"exercise",id:x.e.id})},
      el("div",{class:"grow"},el("div",{class:"b ellip",text:x.e.name}),
        el("div",{class:"sm faint",text:t("mejor ritmo ")+fRitmo(x.pr.ritmo)+" · "+fMin(x.pr.min)+t(" seguidos")})),
      el("span",{class:"pill pr",text:fNum(x.pr.km,2)+" km"})));
  }
  const exs=allOf("exercise").filter(e=>!esCardio(e)).map(e=>({e,pr:prFor(e.id)})).filter(x=>x.pr.w>0)
    .sort((a,b)=>b.pr.o-a.pr.o);
  v.appendChild(el("div",{class:"sec-title",text:t("Récords personales")}));
  if(!exs.length) v.appendChild(el("p",{class:"sm faint center",style:"padding:12px",
    text:t("Registra entrenos y aquí verás tus mejores marcas.")}));
  for(const x of exs) v.appendChild(el("button",{class:"item",onclick:()=>push({v:"exercise",id:x.e.id})},
    el("div",{class:"grow"},el("div",{class:"b ellip",text:x.e.name}),
      el("div",{class:"sm faint",text:t("1RM estimado ")+fNum(x.pr.o,1)+" kg"})),
    el("span",{class:"pill pr",text:fNum(x.pr.w)+" kg"})));

  const totalW=allOf("workout").filter(w=>w.status!=="active").length;
  if(totalW>2){
    const porSemana={};
    for(const w of allOf("workout")){ if(w.status==="active")continue;
      const k=w.date.slice(0,10); porSemana[k]=(porSemana[k]||0)+workoutStats(w).vol; }
    const pts=Object.keys(porSemana).sort().slice(-14).map(k=>({x:k,y:porSemana[k]}));
    v.appendChild(el("div",{class:"sec-title",text:t("Volumen por sesión")}));
    v.appendChild(el("div",{class:"card"},barChart(pts,"kg")));
  }
}

/* ============================ FOTOS ============================ */
const POSES=["Frontal","Lateral","Espalda","Otra"];
let poseFilter="Todas", cmpSel=[];
const openRows=new Set();
function resizeImage(file,maxPx){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,maxPx/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error(t("No se pudo procesar la imagen"))),"image/jpeg",.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(t("Imagen no válida")));};
    img.src=url;
  });
}
async function addPhoto(file,pose){
  toast(t("Guardando foto…"));
  const url=await uploadImage(file,1600);
  if(!url) return;
  put({id:"ph_"+uid8(),type:"photo",date:todayISO(),url,pose:pose||"Frontal",note:""});
  toast(t("Foto guardada"));
}
function viewPhotos(v){
  const fotos=allOf("photo").sort((a,b)=>a.date<b.date?1:-1);
  head(t("Fotos"),fotos.length+t(" fotos de progreso"));
  const inp=el("input",{type:"file",accept:"image/*",style:"display:none",
    onchange:e=>{const f=e.target.files[0]; if(f) addPhoto(f,poseFilter==="Todas"?"Frontal":poseFilter); e.target.value="";}});
  v.appendChild(inp);
  v.appendChild(el("div",{class:"row",style:"gap:8px;margin-bottom:12px"},
    el("button",{class:"btn primary grow",onclick:()=>inp.click()},svgI(ICO.camera),t("Añadir foto")),
    fotos.length>1?el("button",{class:"btn",onclick:()=>{cmpSel=[];push({v:"compare"});}},t("Comparar")):null));
  if(!S.uid&&S.loaded&&fotos.length) v.appendChild(el("div",{class:"banner warn"},
    el("div",null,t("Las fotos se guardan en este dispositivo. Haz una copia de seguridad de vez en cuando desde tu ficha."))));
  if(!fotos.length){ v.appendChild(emptyState(ICO.camera,t("Sin fotos todavía"),
    t("Hazte una foto en la misma pose y con luz parecida cada 2–4 semanas: así se nota de verdad el cambio."))); return; }
  const chips=el("div",{class:"chips"});
  for(const p of ["Todas",...POSES]) chips.appendChild(el("button",{class:"chip"+(p===poseFilter?" on":""),
    onclick:()=>{poseFilter=p;render();}},t(p)));
  v.appendChild(chips);
  const list=fotos.filter(f=>poseFilter==="Todas"||f.pose===poseFilter);
  const grid=el("div",{class:"pgrid",style:"margin-top:10px"});
  for(const f of list){
    grid.appendChild(el("button",{class:"ph",onclick:()=>sheetPhoto(f)},
      el("img",{src:rurl(f.url),loading:"lazy",alt:"Foto "+f.date}),
      el("div",{class:"dt",text:fDate(f.date)})));
  }
  v.appendChild(grid);
}
function sheetPhoto(f){
  sheet(fDate(f.date,true),(b,close)=>{
    b.appendChild(el("img",{src:rurl(f.url),style:"width:100%;border-radius:13px;display:block;margin-bottom:14px",alt:""}));
    const sel=el("select",null,...POSES.map(p=>el("option",{value:p,text:t(p)})));
    sel.value=f.pose||"Frontal";
    sel.addEventListener("change",()=>{f.pose=sel.value;put(f,{silent:true});});
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Pose")}),sel));
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Fecha")}),
      el("input",{type:"date",value:f.date,onchange:e=>{f.date=e.target.value||f.date;put(f,{silent:true});}})));
    b.appendChild(el("label",{class:"fld"},el("span",{text:t("Nota")}),
      el("input",{type:"text",value:f.note||"",placeholder:t("Peso, semana del plan…"),
        oninput:e=>{f.note=e.target.value;put(f,{silent:true,debounce:true});}})));
    b.appendChild(el("button",{class:"btn full ghost danger",onclick:()=>{close();
      confirmSheet(t("Eliminar foto"),"",async()=>{
        const u=f.url, aid=f.assetId; removeDoc(f.id);
        if(typeof u==="string"&&u.startsWith("local:")){ IDB.del(u.slice(6));
          const o=localURLs.get(u); if(o){URL.revokeObjectURL(o);localURLs.delete(u);} }
        else if(S.assets&&aid){ try{ await S.assets.delete(aid); }catch(e){} }
      });}},svgI(ICO.trash),t("Eliminar foto")));
  });
}
function viewCompare(v){
  const fotos=allOf("photo").sort((a,b)=>a.date<b.date?1:-1);
  head(t("Comparar"),t("Elige dos fotos"));
  v.appendChild(backBar(t("Fotos")));
  const a=getDoc(cmpSel[0]), b=getDoc(cmpSel[1]);
  if(a&&b){
    const [o,n] = a.date<=b.date?[a,b]:[b,a];
    const dias=Math.round((new Date(n.date)-new Date(o.date))/864e5);
    v.appendChild(el("div",{class:"cmp",style:"margin-bottom:10px"},
      el("figure",null,el("img",{src:rurl(o.url),alt:""}),el("figcaption",{text:fDate(o.date)})),
      el("figure",null,el("img",{src:rurl(n.url),alt:""}),el("figcaption",{text:fDate(n.date)}))));
    v.appendChild(el("p",{class:"sm muted center",style:"margin:0 0 14px",
      text:dias>0?dias+t(" días de diferencia"):t("Mismo día")}));
    v.appendChild(el("button",{class:"btn full",style:"margin-bottom:14px",
      onclick:()=>{cmpSel=[];render();}},t("Elegir otras")));
  }
  const grid=el("div",{class:"pgrid"});
  for(const f of fotos){
    const i=cmpSel.indexOf(f.id);
    grid.appendChild(el("button",{class:"ph"+(i>=0?" sel":""),onclick:()=>{
      if(i>=0) cmpSel.splice(i,1); else { cmpSel.push(f.id); if(cmpSel.length>2)cmpSel.shift(); }
      render();
    }},el("img",{src:f.url,loading:"lazy",alt:""}),
      i>=0?el("div",{class:"selbadge",text:String(i+1)}):null,
      el("div",{class:"dt",text:fDate(f.date)})));
  }
  v.appendChild(grid);
}

/* ============================ inicio ============================ */
function applySplash(url){
  const sp=document.getElementById("splash"); if(!sp||!url)return;
  sp.style.backgroundImage="url('"+url+"')"; sp.classList.add("hasimg");
  if(url.indexOf("blob:")!==0){ try{ localStorage.setItem("gym.v1.splash",url); }catch(e){} }
}
(function initSplash(){
  try{ const u=localStorage.getItem("gym.v1.splash"); if(u) applySplash(u); }catch(e){}
  const sp=document.getElementById("splash"); if(!sp)return;
  const fuera=()=>{ sp.classList.add("gone"); setTimeout(()=>sp.remove(),500); };
  sp.addEventListener("click",fuera);
  setTimeout(fuera,1700);
})();
render();
boot().catch(e=>{ console.error(e); S.loaded=true; render(); });
/* funcionamiento sin internet cuando está alojada en un servidor propio */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
